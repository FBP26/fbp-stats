<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FBP All-Time Stats</title>
<link href="https://unpkg.com/tabulator-tables@5.6.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@5.6.0/dist/js/tabulator.min.js"></script>
<style>
  :root { --bg: #0d1117; --panel: #151c24; --panel-2: #1b2530; --border: #2a3744; --text: #e8eef5; --muted: #91a0ae; --accent: #54d6b2; --accent-2: #ffb454; --danger: #ff7180; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: radial-gradient(circle at 85% 0%, #19363a 0, transparent 34rem), var(--bg); color: var(--text); }
  header { padding: 22px clamp(16px, 4vw, 52px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  header h1 { font-size: 24px; margin: 0; white-space: nowrap; letter-spacing: 0; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button, button, select { font: inherit; }
  nav button { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 7px 11px; font-family: Arial, sans-serif; font-size: 12px; cursor: pointer; }
  nav button:hover, nav button.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  main { max-width: 1500px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 52px) 60px; }
  .eyebrow { color: var(--accent); font: 11px Arial, sans-serif; letter-spacing: 1.4px; text-transform: uppercase; }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; }
  .intro h2 { font-size: clamp(28px, 5vw, 50px); line-height: 1; margin: 7px 0 0; font-weight: 400; }
  .intro p { color: var(--muted); font: 13px Arial, sans-serif; max-width: 390px; line-height: 1.5; margin: 0; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(270px, .5fr); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
  .chart-panel { min-height: 430px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 14px; }
  .panel h3 { font-size: 17px; font-weight: 400; margin: 0; }
  .controls { display: grid; gap: 13px; }
  label { color: var(--muted); display: grid; gap: 5px; font: 11px Arial, sans-serif; text-transform: uppercase; letter-spacing: .8px; }
  select, input { width: 100%; border: 1px solid var(--border); border-radius: 5px; background: var(--panel-2); color: var(--text); padding: 9px 10px; font: 13px Arial, sans-serif; }
  select[multiple] { min-height: 112px; }
  .range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
  .metric { padding: 13px; background: var(--panel-2); border-left: 2px solid var(--accent); }
  .metric span { display: block; color: var(--muted); font: 10px Arial, sans-serif; text-transform: uppercase; letter-spacing: .7px; }
  .metric strong { display: block; margin-top: 6px; font-size: 22px; font-weight: 400; }
  .chart-wrap { height: 335px; position: relative; }
  .table-section { margin-top: 28px; }
  #search-box { margin-bottom: 12px; }
  #search-box input { max-width: 350px; }
  #table-title { color: var(--muted); font-size: 16px; margin: 0 0 12px; }
  #stats-table { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tabulator { background: var(--panel); border: none; font: 13px Arial, sans-serif; }
  .tabulator-header, .tabulator-col { background: #202c38 !important; border-color: var(--border) !important; }
  .tabulator-row { background: var(--panel) !important; color: var(--text); border-color: var(--border); }
  .tabulator-row.tabulator-row-even { background: #121920 !important; }
  .tabulator-row:hover { background: #263b40 !important; }
  #loading { color: var(--muted); font: 13px Arial, sans-serif; }
  @media (max-width: 850px) { .workspace { grid-template-columns: 1fr; } .intro { display: block; } .intro p { margin-top: 14px; } }
  @media (max-width: 560px) { .summary { grid-template-columns: repeat(2, 1fr); } .panel-head { align-items: start; flex-direction: column; } }
</style>
</head>
<body>
<header><h1>FBP All-Time Stats</h1><nav id="nav"></nav></header>
<main>
  <section class="intro"><div><div class="eyebrow">The record book, in motion</div><h2>See the seasons unfold.</h2></div><p>Filter the history by player, season, and competition. Every chart is linked to the same weekly results behind the tables.</p></section>
  <section class="workspace">
    <div class="panel chart-panel">
      <div class="panel-head"><h3 id="chart-title">Wins by season</h3><label style="width:180px">View<select id="chart-metric"><option value="wins">Wins</option><option value="winPct">Win percentage</option><option value="money">Money won</option><option value="rank">Average rank</option></select></label></div>
      <div class="chart-wrap"><canvas id="history-chart"></canvas></div>
    </div>
    <aside class="panel controls">
      <label>Players<select id="player-filter" multiple></select></label>
      <label>Competition<select id="competition-filter"><option value="all">Regular season + playoffs</option><option value="regular">Regular season only</option><option value="playoffs">Playoffs only</option></select></label>
      <label>Season range<div class="range"><select id="season-from"></select><select id="season-to"></select></div></label>
      <label>Chart<select id="chart-style"><option value="line">Trend line</option><option value="bar">Bars</option></select></label>
    </aside>
  </section>
  <section class="summary"><div class="metric"><span>Weeks shown</span><strong id="weeks-count">0</strong></div><div class="metric"><span>Wins shown</span><strong id="wins-count">0</strong></div><div class="metric"><span>Money shown</span><strong id="money-count">$0</strong></div><div class="metric"><span>Players shown</span><strong id="players-count">0</strong></div></section>
  <section class="table-section"><div id="search-box"><input type="text" id="global-search" placeholder="Search this table..." /></div><p id="table-title"></p><div id="loading">Loading...</div><div id="stats-table"></div></section>
</main>
<script>
const DATA_DIR = "data";
let table = null, chart = null, manifest = [], dashboard = [];
const colors = ["#54d6b2", "#ffb454", "#8ca7ff", "#ff7180", "#d79bff", "#f1e48b", "#65c7e8"];
function moneyFormatter(cell) { const v = cell.getValue(); if (v === "" || v == null) return ""; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[^0-9.-]/g, "")); return isNaN(n) ? v : "$" + n.toLocaleString(); }
function percentFormatter(cell) { const v = cell.getValue(); if (v === "" || v == null) return ""; const n = typeof v === "number" ? v : parseFloat(v); return isNaN(n) ? v : (n * 100).toFixed(2) + "%"; }
function isMoneyColumn(name) { return /money|won\s*\$|streak.*money/i.test(name) && !/won during|weeks during/i.test(name); }
function isPercentColumn(name) { return /^%$|win\s*%|%\s*won/i.test(name); }
function buildColumns(columns, rows) { return columns.map(col => { const sample = rows.find(r => r[col] !== "" && r[col] != null); const value = sample && sample[col]; const numeric = value !== undefined && value !== "" && !isNaN(parseFloat(String(value).replace(/[$,%]/g, ""))); const def = { title: col, field: col, headerFilter: true, headerFilterPlaceholder: "filter...", sorter: numeric ? "number" : "string" }; if (isMoneyColumn(col)) def.formatter = moneyFormatter; else if (isPercentColumn(col)) def.formatter = percentFormatter; return def; }); }
async function loadTable(key, title, columns) { document.getElementById("table-title").textContent = title; document.getElementById("loading").style.display = "block"; const rows = await (await fetch(`${DATA_DIR}/${key}.json`)).json(); document.getElementById("loading").style.display = "none"; if (table) table.destroy(); table = new Tabulator("#stats-table", { data: rows, layout: "fitDataStretch", columns: buildColumns(columns, rows), pagination: true, paginationSize: 25, paginationSizeSelector: [15, 25, 50, 100, true], placeholder: "No data" }); document.getElementById("global-search").oninput = e => { const val = e.target.value.toLowerCase(); table.clearFilter(); if (val) table.setFilter(data => Object.values(data).some(v => String(v).toLowerCase().includes(val))); }; }
function setActiveNav(key) { document.querySelectorAll("#nav button").forEach(btn => btn.classList.toggle("active", btn.dataset.key === key)); }
function selectedPlayers() { return [...document.getElementById("player-filter").selectedOptions].map(o => o.value); }
function filteredDashboard() { const from = document.getElementById("season-from").value, to = document.getElementById("season-to").value, competition = document.getElementById("competition-filter").value; const players = selectedPlayers(); return dashboard.filter(row => (!players.length || players.includes(row.Name)) && (!from || row.Season >= from) && (!to || row.Season <= to) && (competition === "all" || (competition === "playoffs" ? row.Week === "playoffs" : row.Week !== "playoffs"))); }
function updateChart() { const rows = filteredDashboard(), metric = document.getElementById("chart-metric").value, style = document.getElementById("chart-style").value; const seasons = [...new Set(rows.map(r => r.Season))].sort(); const players = selectedPlayers().length ? selectedPlayers() : [...new Set(rows.map(r => r.Name))].slice(0, 8); const datasets = players.map((name, index) => { const points = seasons.map(season => { const matches = rows.filter(r => r.Name === name && r.Season === season); if (!matches.length) return null; if (metric === "wins") return matches.reduce((s, r) => s + Number(r.Wins || 0), 0); if (metric === "money") return matches.reduce((s, r) => s + Number(r.Winnings || 0), 0); if (metric === "rank") return matches.reduce((s, r) => s + Number(r.Rank || 0), 0) / matches.length; const games = matches.reduce((s, r) => s + Number(r.Wins || 0) + Number(r.Losses || 0), 0); return games ? matches.reduce((s, r) => s + Number(r.Wins || 0), 0) / games * 100 : 0; }); return { label: name, data: points, borderColor: colors[index % colors.length], backgroundColor: colors[index % colors.length] + "99", tension: .25, fill: false }; }); const labels = metric === "winPct" ? "Win percentage" : metric === "money" ? "Money won" : metric === "rank" ? "Average rank" : "Wins"; document.getElementById("chart-title").textContent = labels + " by season"; if (chart) chart.destroy(); chart = new Chart(document.getElementById("history-chart"), { type: style, data: { labels: seasons, datasets }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false }, plugins: { legend: { labels: { color: "#e8eef5" } } }, scales: { x: { ticks: { color: "#91a0ae" }, grid: { color: "#2a3744" } }, y: { beginAtZero: metric !== "rank", ticks: { color: "#91a0ae", callback: value => metric === "money" ? "$" + value : metric === "winPct" ? value + "%" : value }, grid: { color: "#2a3744" } } } } }); document.getElementById("weeks-count").textContent = rows.length.toLocaleString(); document.getElementById("wins-count").textContent = rows.reduce((s, r) => s + Number(r.Wins || 0), 0).toLocaleString(); document.getElementById("money-count").textContent = "$" + rows.reduce((s, r) => s + Number(r.Winnings || 0), 0).toLocaleString(); document.getElementById("players-count").textContent = new Set(rows.map(r => r.Name)).size; }
function bindDashboard() { ["player-filter", "competition-filter", "season-from", "season-to", "chart-metric", "chart-style"].forEach(id => document.getElementById(id).onchange = updateChart); }
async function initDashboard() { dashboard = await (await fetch(`${DATA_DIR}/dashboard.json`)).json(); const players = [...new Set(dashboard.map(r => r.Name))].sort(); const seasons = [...new Set(dashboard.map(r => r.Season))].sort(); const playerSelect = document.getElementById("player-filter"); players.forEach(name => playerSelect.add(new Option(name, name))); const from = document.getElementById("season-from"), to = document.getElementById("season-to"); seasons.forEach(season => { from.add(new Option(season, season)); to.add(new Option(season, season)); }); from.value = seasons[0] || ""; to.value = seasons[seasons.length - 1] || ""; bindDashboard(); updateChart(); }
async function init() { manifest = await (await fetch(`${DATA_DIR}/manifest.json`)).json(); const nav = document.getElementById("nav"); manifest.forEach((entry, idx) => { const btn = document.createElement("button"); btn.textContent = entry.title; btn.dataset.key = entry.key; btn.onclick = () => { setActiveNav(entry.key); loadTable(entry.key, entry.title, entry.columns); }; nav.appendChild(btn); if (idx === 0) { setActiveNav(entry.key); loadTable(entry.key, entry.title, entry.columns); } }); await initDashboard(); }
init();
</script>
</body>
</html>
