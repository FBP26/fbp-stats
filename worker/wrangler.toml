name = "fbp-api"
main = "src/index.ts"
compatibility_date = "2026-08-26"

[triggers]
crons = ["*/5 * * * *"]

[vars]
CORS_ORIGIN = "https://fbp26.github.io"
PUBLIC_API_URL = "https://fbp-api.fbp-api-worker.workers.dev"
PUBLIC_SITE_URL = "https://fbp26.github.io/fbp-stats/"
EMAIL_RELAY_URL = "https://script.google.com/macros/s/AKfycbxZUgJm6LstCEomhmrlJYa_nH7tsmxC_4UZwYdroIZbs-PeI6KdPqUZtsF9fZvr_YuNWQ/exec"
ADMIN_PUSH_PLAYER = "Jim"

[[d1_databases]]
binding = "DB"
database_name = "fbp"
database_id = "30774d69-00cb-48de-af6b-d847202859d7"
migrations_dir = "migrations"

# Test copy: https://fbp-api-staging.fbp-api-worker.workers.dev — deployed from any branch other than main.
# No scheduled jobs and no email relay, so it never sends emails or pushes. Its database is a weekly copy of
# production with notification contacts blanked (see .github/workflows/staging-refresh.yml).
[env.staging]
name = "fbp-api-staging"

[env.staging.triggers]
crons = []

[env.staging.vars]
CORS_ORIGIN = "*"
PUBLIC_API_URL = "https://fbp-api-staging.fbp-api-worker.workers.dev"
PUBLIC_SITE_URL = "https://fbp26.github.io/fbp-stats/"
ADMIN_PUSH_PLAYER = ""
# Test copy only: enables POST ?action=test-run-scheduled, and replays the previous season's playoffs from ESPN.
TEST_COPY = "1"
TEST_REPLAY_SEASON_OFFSET = "-1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fbp-staging"
database_id = "98030782-5aff-4211-b2c3-facc117ae3c4"
