name: Retire old private ledger Worker (one-off)

# Turns off the public address of the unused fbp-private-ledger-api Worker (replaced by FBP Admin).
# Nothing is deleted: the Worker's code and its D1 tables stay, and the address can be re-enabled in the dashboard.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-old-ledger.yml"

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Disable fbp-private-ledger-api on workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fbp-private-ledger-api/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"enabled":false,"previews_enabled":false}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("success:",j.success);if(!j.success)process.exit(1)})'
