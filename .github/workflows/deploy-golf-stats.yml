# Deploys the Golf Stats API Worker (golf-stats) from FBP26/golfwithjim/stats-worker using this repo's
# Cloudflare deploy secrets. The score-entry passcode comes from this repo's GOLF_ADMIN_PASSWORD secret.
# Run manually.
name: Deploy Golf Stats Worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "golfwithjim branch or commit to deploy"
        required: false
        default: main

concurrency:
  group: deploy-golf-stats
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FBP26/golfwithjim
          ref: ${{ github.event.inputs.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: stats-worker
        run: npm ci
      - name: Tests
        working-directory: stats-worker
        run: npm test
      - name: Create or update tables
        working-directory: stats-worker
        run: npx wrangler d1 execute golf-stats --remote --file schema.sql
      - name: Deploy
        working-directory: stats-worker
        run: npx wrangler deploy
      - name: Set score-entry passcode
        working-directory: stats-worker
        env:
          GOLF_ADMIN_PASSWORD: ${{ secrets.GOLF_ADMIN_PASSWORD }}
        run: |
          if [ -z "$GOLF_ADMIN_PASSWORD" ]; then
            echo "::warning::GOLF_ADMIN_PASSWORD secret is not set; score entry stays locked."
          else
            printf '%s' "$GOLF_ADMIN_PASSWORD" | npx wrangler secret put GOLF_ADMIN_PASSWORD
          fi
