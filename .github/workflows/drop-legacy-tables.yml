name: Drop legacy D1 tables (one-off)

# Takes a full backup of production D1 to R2 (archive/, never expires), then drops the unused legacy tables
# listed in worker/migrations/0012_drop_legacy_tables.sql. Runs once when this file is pushed to main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drop-legacy-tables.yml"

jobs:
  drop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Back up production first
        run: |
          npx wrangler d1 export fbp --remote --output "$RUNNER_TEMP/fbp.sql"
          gzip -9 "$RUNNER_TEMP/fbp.sql"
          ls -la "$RUNNER_TEMP/fbp.sql.gz"
          npx wrangler r2 object put "fbp-backups/archive/pre-cleanup-2026-11-17.sql.gz" --file "$RUNNER_TEMP/fbp.sql.gz" --content-type application/gzip --remote
      - name: Drop legacy tables
        run: |
          npx wrangler d1 execute fbp --remote -y --file migrations/0012_drop_legacy_tables.sql
          npx wrangler d1 execute fbp-staging --remote -y --file migrations/0012_drop_legacy_tables.sql || echo "Staging copy skipped."
