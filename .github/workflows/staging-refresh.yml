name: Refresh test copy database
# Runs on demand, weekly (Tuesdays after picks open), and when this file changes. The weekly test pick runs after it.

# Copies production D1 into fbp-staging (used by the test Worker), then blanks notification contacts and push
# subscriptions so the test copy can never message anyone.
on:
  schedule:
    - cron: "41 19 * * 2" # Tuesdays ~2:41 PM Eastern, after the new week's picks open
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-refresh.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Export production
        run: npx wrangler d1 export fbp --remote --output "$RUNNER_TEMP/fbp.sql"
      - name: Empty the test database
        run: |
          npx wrangler d1 execute fbp-staging --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" > "$RUNNER_TEMP/tables.json"
          node -e '
            const rows = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].results;
            const sql = ["PRAGMA defer_foreign_keys = true;", ...rows.map(r => `DROP TABLE IF EXISTS "${r.name}";`)].join("\n");
            require("fs").writeFileSync(process.argv[2], sql);
          ' "$RUNNER_TEMP/tables.json" "$RUNNER_TEMP/drop.sql"
          cat "$RUNNER_TEMP/drop.sql"
          npx wrangler d1 execute fbp-staging --remote --file "$RUNNER_TEMP/drop.sql" -y
      - name: Import and scrub
        run: |
          npx wrangler d1 execute fbp-staging --remote --file "$RUNNER_TEMP/fbp.sql" -y
          npx wrangler d1 execute fbp-staging --remote -y --command "UPDATE notification_subscriptions SET destination = 'test-copy', normalized_destination = 'test-copy-' || id, status = 'unsubscribed'; DELETE FROM push_device_players; DELETE FROM push_devices;"
