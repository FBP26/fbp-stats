name: Nightly D1 backup

# Exports the production D1 database every night to the private R2 bucket "fbp-backups" (kept 120 days).
# D1 also keeps its own 30-day point-in-time history (Time Travel).
on:
  schedule:
    - cron: "17 9 * * *" # 4:17 AM Eastern (standard time)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Export production database
        run: npx wrangler d1 export fbp --remote --output "$RUNNER_TEMP/fbp.sql"
      - name: Compress and upload to R2
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          gzip -9 "$RUNNER_TEMP/fbp.sql"
          ls -la "$RUNNER_TEMP/fbp.sql.gz"
          npx wrangler r2 object put "fbp-backups/d1/fbp-$STAMP.sql.gz" --file "$RUNNER_TEMP/fbp.sql.gz" --content-type application/gzip --remote
          echo "Backed up to R2 fbp-backups/d1/fbp-$STAMP.sql.gz" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep 120 days of backups
        run: npx wrangler r2 bucket lifecycle add fbp-backups expire-d1-backups d1/ --expire-days 120 -y || echo "Lifecycle rule already set."
