name: FBP public health

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public picks and current week
        id: health
        run: node scripts/check-public-health.mjs
      - name: Open outage alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'FBP public health check failing';
            const failures = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            if (failures.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled public health check failed at ${new Date().toISOString()}. Enter Picks or Current Week may be unavailable.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Close recovered outage alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'FBP public health check failing';
            const failures = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const issue of failures.data.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Recovered at ${new Date().toISOString()}. The public picks and current-week checks are passing again.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }